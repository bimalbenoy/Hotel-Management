global:
  scrape_interval: 5s

scrape_configs:

  # Booking Service
  - job_name: "booking-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3060


  # Payment Service
  - job_name: "payment-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3061


  # Notification Service
  - job_name: "notification-service"
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3062


  # Kafka Monitor
  - job_name: "kafka-monitor"
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3070


  # Redis
  - job_name: "redis"
    metrics_path: /metrics
    static_configs:
      - targets:
          - redis-exporter:9121


  # Kafka Availability
  - job_name: "kafka"
    metrics_path: /probe

    params:
      module:
        - kafka_tcp

    static_configs:
      - targets:
          - 172.23.74.113:9092

    relabel_configs:

      # Put Kafka address into the target parameter
      - source_labels:
          - __address__
        target_label: __param_target

      # Use Kafka address as the instance label
      - source_labels:
          - __param_target
        target_label: instance

      # Tell Prometheus to send the probe to Blackbox
      - target_label: __address__
        replacement: blackbox-exporter:9115